server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理示例：把 /api 转发到 tomcat 容器
    location /api/ {
        proxy_pass http://tomcat:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
